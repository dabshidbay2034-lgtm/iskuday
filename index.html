<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable: blocking pinch-zoom fails WCAG 1.4.4 on
         a UI that leans on 10-11px labels, for an audience that is almost
         entirely on phones. viewport-fit=cover is what makes env(safe-area-*)
         resolve to anything but 0 — .safe-area-bottom in index.css depends on it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MogadishuRents — Rent Houses, Apartments & Hotels in Mogadishu</title>
    <!-- "Mogadishu's #1 rental platform" was an unsupportable superlative and the
         kind of claim that reads as filler. Describe what the site is instead —
         it also gives Google matchable terms rather than a boast. -->
    <meta name="description" content="Find houses, apartments, hotel rooms and commercial space to rent across all 18 districts of Mogadishu. See photos and prices, and contact the owner directly." />
    <meta name="keywords" content="Mogadishu rent, houses for rent Mogadishu, apartments Mogadishu, hotel rooms Somalia, commercial space Mogadishu, kiro Mogadishu, guri kiro" />
    <meta name="author" content="MogadishuRents" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mogadishurents.com/" />
    <meta name="theme-color" content="#D6A23E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MogadishuRents" />
    <!-- Favicon chain (from platform kit) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon_96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple_touch_icon_180.png" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="MogadishuRents" />
    <meta property="og:title" content="MogadishuRents — Rent Houses, Apartments & Hotels in Mogadishu" />
    <meta property="og:description" content="Mogadishu's #1 rental platform. Browse verified houses, apartments, hotels & commercial spaces for rent." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mogadishurents.com/" />
    <meta property="og:image" content="https://mogadishurents.com/icon-512.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MogadishuRents — Rent Houses, Apartments & Hotels in Mogadishu" />
    <meta name="twitter:description" content="Mogadishu's #1 rental platform. Browse verified listings and find your next home." />
    <meta name="twitter:image" content="https://mogadishurents.com/icon-512.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MogadishuRents",
      "url": "https://mogadishurents.com",
      "description": "Mogadishu's leading rental platform for houses, apartments, hotels, and commercial spaces.",
      "applicationCategory": "RealEstateApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "category": "Real Estate Rentals"
      },
      "areaServed": {
        "@type": "City",
        "name": "Mogadishu",
        "containedInPlace": {
          "@type": "Country",
          "name": "Somalia"
        }
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter carries 700 as well as 400–600.
         `font-bold` appears ~148 times in the app and Inter is the BODY face
         (`--font-body`), so without a real 700 cut the browser synthesised one
         by smearing the 600 — which is why bold body text looked slightly
         muddy next to the headings, whose face does ship 700/800. One extra
         weight is worth it at that usage count. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
